<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Degradados -->
    <linearGradient id="podBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf2fc"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00234b"/>
      <stop offset="100%" stop-color="#0d6efd"/>
    </linearGradient>
    <linearGradient id="iotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>

  <!-- CARCASA DEL DISPOSITIVO BIOMÉDICO / SENSOR INTELIGENTE (Cápsula de grado médico) -->
  <rect x="6" y="6" width="52" height="52" rx="16" 
        fill="url(#podBg)" 
        stroke="#00234b" 
        stroke-width="2.2"/>
  
  <!-- Anillo concéntrico de calibración y precisión diagnóstica -->
  <circle cx="32" cy="32" r="23" 
          fill="none" 
          stroke="#0d6efd" 
          stroke-width="1" 
          stroke-opacity="0.25"/>

  <!-- LÍNEA 1: SISTEMAS EMBEBIDOS (Pads de bio-sensores y bus de hardware en la base) -->
  <g opacity="0.85">
    <!-- Pistas de bus de datos y conexión a electrodos -->
    <path d="M 18 52 L 18 45 L 24 45" fill="none" stroke="#003366" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="18" cy="52" r="2.2" fill="#00234b"/>

    <path d="M 46 52 L 46 45 L 40 45" fill="none" stroke="#003366" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="46" cy="52" r="2.2" fill="#00234b"/>

    <circle cx="32" cy="49" r="2" fill="#0d6efd"/>
    <line x1="32" y1="45" x2="32" y2="49" stroke="#0d6efd" stroke-width="1.5"/>
  </g>

  <!-- LÍNEA 2: MONITOREO BIOMÉDICO / SEÑALES VITALES (Trazo continuo central) -->
  <path d="M 11 32 L 20 32 L 23 23 L 27 41 L 31 16 L 35 43 L 38 29 L 41 34 L 44 32 L 53 32" 
        fill="none" 
        stroke="url(#aiGrad)" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- LÍNEA 3: INTELIGENCIA ARTIFICIAL & IOT TELEMETRÍA (Nodos sinápticos + Antena) -->
  <!-- Nodos de red neuronal en los vértices de la señal -->
  <circle cx="31" cy="16" r="3.2" fill="#00b4d8" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="27" cy="41" r="2.2" fill="#00234b" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="35" cy="43" r="2.2" fill="#0d6efd" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="23" cy="23" r="2" fill="#00b4d8"/>

  <!-- Enlaces de IA / Red profunda interconectada -->
  <line x1="23" y1="23" x2="31" y2="16" stroke="#00b4d8" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  <line x1="31" y1="16" x2="38" y2="21" stroke="#00b4d8" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  <circle cx="38" cy="21" r="1.8" fill="#00234b"/>

  <!-- Ondas de Telemetría IoT en la parte superior (Transmisión a la nube clínica) -->
  <path d="M 27 10 A 6 6 0 0 1 37 10" fill="none" stroke="url(#iotGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 23 7 A 11 11 0 0 1 41 7" fill="none" stroke="url(#iotGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
</svg>
