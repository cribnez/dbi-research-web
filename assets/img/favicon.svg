<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 3 Colores planos sin degradados: #00234b (Marino), #0d6efd (Azul), #00b4d8 (Cian) -->

  <!-- PINES DE HARDWARE / SISTEMAS EMBEBIDOS -->
  <g stroke="#00234b" stroke-width="2.2" stroke-linecap="round">
    <!-- Pines Superiores -->
    <line x1="24" y1="8" x2="24" y2="13"/>
    <line x1="32" y1="6" x2="32" y2="13"/>
    <line x1="40" y1="8" x2="40" y2="13"/>
    <!-- Pines Inferiores -->
    <line x1="24" y1="51" x2="24" y2="56"/>
    <line x1="32" y1="51" x2="32" y2="58"/>
    <line x1="40" y1="51" x2="40" y2="56"/>
    <!-- Pines Laterales Izquierdos -->
    <line x1="8" y1="24" x2="13" y2="24"/>
    <line x1="6" y1="32" x2="13" y2="32"/>
    <line x1="8" y1="40" x2="13" y2="40"/>
    <!-- Pines Laterales Derechos -->
    <line x1="51" y1="24" x2="56" y2="24"/>
    <line x1="51" y1="32" x2="58" y2="32"/>
    <line x1="51" y1="40" x2="56" y2="40"/>
  </g>

  <!-- CUERPO DEL MICROCHIP MÉDICO EMBEBIDO -->
  <rect x="13" y="13" width="38" height="38" rx="8"
        fill="#ffffff"
        stroke="#00234b"
        stroke-width="2.4"/>

  <!-- Borde interno -->
  <rect x="17" y="17" width="30" height="30" rx="4"
        fill="none"
        stroke="#0d6efd"
        stroke-width="1"/>

  <!-- TELEMETRÍA IOT / ONDAS INALÁMBRICAS -->
  <path d="M 43 19 A 6 6 0 0 1 48 24" fill="none" stroke="#00b4d8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 43 15 A 10 10 0 0 1 52 24" fill="none" stroke="#00b4d8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- PISTAS DE CIRCUITO / SISTEMAS EMBEBIDOS -->
  <path d="M 18 22 L 23 22 L 26 27" fill="none" stroke="#00234b" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="18" cy="22" r="1.4" fill="#00234b"/>

  <path d="M 18 42 L 23 42 L 26 37" fill="none" stroke="#00234b" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="18" cy="42" r="1.4" fill="#00234b"/>

  <!-- SEÑAL DE MONITOREO BIOMÉDICO (Pulso vital plano) -->
  <path d="M 17 32 L 24 32 L 27 25 L 30 38 L 33 21 L 36 41 L 39 32 L 46 32"
        fill="none"
        stroke="#0d6efd"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- NODOS DE INTELIGENCIA ARTIFICIAL -->
  <line x1="33" y1="21" x2="38" y2="21" stroke="#00b4d8" stroke-width="1.3" stroke-dasharray="1.5 1.5"/>
  <circle cx="33" cy="21" r="2.8" fill="#00b4d8" stroke="#ffffff" stroke-width="1"/>
  <circle cx="38" cy="21" r="2" fill="#0d6efd"/>

  <circle cx="46" cy="32" r="2.8" fill="#00234b" stroke="#ffffff" stroke-width="1"/>
  <circle cx="30" cy="38" r="2.2" fill="#00234b" stroke="#ffffff" stroke-width="0.9"/>
  <circle cx="36" cy="41" r="2.2" fill="#0d6efd" stroke="#ffffff" stroke-width="0.9"/>
</svg>
