<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Degradados -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00234b"/>
      <stop offset="50%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>

  <!-- PINES DE HARDWARE / SISTEMAS EMBEBIDOS (Pines externos del microcontrolador) -->
  <g stroke="#003366" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <!-- Pines Superiores -->
    <line x1="24" y1="8" x2="24" y2="14"/>
    <line x1="32" y1="6" x2="32" y2="14"/>
    <line x1="40" y1="8" x2="40" y2="14"/>
    <!-- Pines Inferiores -->
    <line x1="24" y1="50" x2="24" y2="56"/>
    <line x1="32" y1="50" x2="32" y2="58"/>
    <line x1="40" y1="50" x2="40" y2="56"/>
    <!-- Pines Laterales Izquierdos -->
    <line x1="8" y1="24" x2="14" y2="24"/>
    <line x1="6" y1="32" x2="14" y2="32"/>
    <line x1="8" y1="40" x2="14" y2="40"/>
    <!-- Pines Laterales Derechos -->
    <line x1="50" y1="24" x2="56" y2="24"/>
    <line x1="50" y1="32" x2="58" y2="32"/>
    <line x1="50" y1="40" x2="56" y2="40"/>
  </g>

  <!-- CUERPO DEL MICROCHIP MÉDICO EMBEBIDO -->
  <rect x="13" y="13" width="38" height="38" rx="8" 
        fill="url(#chipBg)" 
        stroke="#00234b" 
        stroke-width="2.2"/>
  
  <!-- Borde interno de encapsulado de silicio clínico -->
  <rect x="17" y="17" width="30" height="30" rx="4" 
        fill="none" 
        stroke="#0d6efd" 
        stroke-width="0.8" 
        stroke-opacity="0.35"/>

  <!-- TELEMETRÍA IOT / ONDAS DE TRANSMISIÓN INALÁMBRICA (Esquina superior derecha) -->
  <path d="M 43 19 A 6 6 0 0 1 48 24" fill="none" stroke="#00b4d8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 43 15 A 10 10 0 0 1 52 24" fill="none" stroke="#00b4d8" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

  <!-- PISTAS DE CIRCUITO / HARDWARE MÉDICO (Sistemas Embebidos) -->
  <path d="M 18 22 L 23 22 L 26 27" fill="none" stroke="#003366" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <circle cx="18" cy="22" r="1.3" fill="#003366"/>

  <path d="M 18 42 L 23 42 L 26 37" fill="none" stroke="#003366" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <circle cx="18" cy="42" r="1.3" fill="#003366"/>

  <!-- SEÑAL DE MONITOREO BIOMÉDICO (Pulso vital / Signos Vitales IoT) -->
  <path d="M 17 32 L 24 32 L 27 25 L 30 38 L 33 21 L 36 41 L 39 32 L 46 32" 
        fill="none" 
        stroke="url(#traceGrad)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- NODOS DE INTELIGENCIA ARTIFICIAL (Deep Learning / Procesamiento de señales) -->
  <!-- Nodo Superior (Diagnóstico IA) -->
  <line x1="33" y1="21" x2="38" y2="21" stroke="#00b4d8" stroke-width="1.2" stroke-dasharray="1 1.5"/>
  <circle cx="33" cy="21" r="2.8" fill="#00b4d8" stroke="#ffffff" stroke-width="1"/>
  <circle cx="38" cy="21" r="2" fill="#0d6efd"/>

  <!-- Nodo Central / Salida IA -->
  <circle cx="46" cy="32" r="2.8" fill="#00234b" stroke="#ffffff" stroke-width="1"/>

  <!-- Nodo Inferior -->
  <circle cx="30" cy="38" r="2.2" fill="#00234b" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="36" cy="41" r="2.2" fill="#0d6efd" stroke="#ffffff" stroke-width="0.8"/>
</svg>
