<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Degradados -->
    <linearGradient id="hexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00234b"/>
      <stop offset="60%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>

  <!-- BASE DEL DISPOSITIVO: Parche/Sensor Hexagonal de Grado Biomédico -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" 
           fill="url(#hexBg)" 
           stroke="#00234b" 
           stroke-width="2.2" 
           stroke-linejoin="round"/>

  <!-- LÍNEA 1: SISTEMAS EMBEBIDOS (Microchip central y pistas de hardware médico) -->
  <rect x="24" y="24" width="16" height="16" rx="3.5" fill="#ffffff" stroke="#003366" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="3" fill="#0d6efd"/>
  
  <!-- Pistas de bus de datos hacia los vértices del dispositivo -->
  <line x1="24" y1="28" x2="14" y2="28" stroke="#003366" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="14" cy="28" r="1.8" fill="#00234b"/>

  <line x1="24" y1="36" x2="14" y2="36" stroke="#003366" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="14" cy="36" r="1.8" fill="#00234b"/>

  <line x1="40" y1="36" x2="50" y2="36" stroke="#003366" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="50" cy="36" r="1.8" fill="#00234b"/>

  <!-- LÍNEA 2: MONITOREO BIOMÉDICO (Pulso vital continuo cruzando el dispositivo) -->
  <path d="M 12 32 L 20 32 L 23 21 L 27 42 L 32 15 L 37 45 L 41 26 L 45 32 L 52 32" 
        fill="none" 
        stroke="url(#mainGrad)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- LÍNEA 3: INTELIGENCIA ARTIFICIAL & IOT (Nodos sinápticos + Conectividad inalámbrica) -->
  <circle cx="32" cy="15" r="3.2" fill="#00b4d8" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="23" cy="21" r="2.2" fill="#00234b" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="41" cy="26" r="2.2" fill="#0d6efd" stroke="#ffffff" stroke-width="0.8"/>

  <!-- Ondas de Telemetría IoT en la cúspide (Antena del dispositivo médico) -->
  <path d="M 28 9 A 5 5 0 0 1 36 9" fill="none" stroke="#00b4d8" stroke-width="1.6" stroke-linecap="round"/>
</svg>
